<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Avaliação de Risco PBCFT – Circle Capital</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#f0f2f5;color:#1e293b;min-height:100vh;padding:32px 16px}
.wrap{max-width:700px;margin:0 auto}

.header{background:#0c1a2e;border-radius:12px;padding:20px 28px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.header-left{display:flex;align-items:center;gap:12px}
.header-circle{width:36px;height:36px;border-radius:50%;border:2px solid #3b82f6;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.header-inner{width:10px;height:10px;background:#3b82f6;border-radius:50%}
.header-tag{font-size:10px;color:#64748b;letter-spacing:2px;text-transform:uppercase;margin-bottom:3px}
.header-title{font-size:18px;font-weight:600;color:#f8fafc}
.step-counter{font-size:12px;color:#475569;background:#1e293b;padding:6px 12px;border-radius:20px;white-space:nowrap}

.preview{background:#0c1a2e;border-radius:10px;padding:14px 20px;display:none;align-items:center;gap:16px;margin-bottom:16px}
.preview-label{font-size:10px;color:#64748b;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px}
.preview-score{font-size:24px;font-weight:700;color:#f8fafc}
.preview-bar{flex:1}
.preview-track{height:5px;background:#1e293b;border-radius:3px;overflow:hidden;border:1px solid #334155}
.preview-fill{height:100%;border-radius:3px;transition:width .4s,background .4s}
.preview-level{font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;white-space:nowrap}

.card{background:#fff;border-radius:12px;padding:28px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:16px}
.pbar{height:2px;background:#e2e8f0;border-radius:2px;margin-bottom:24px}
.pfill{height:2px;background:#3b82f6;border-radius:2px;transition:width .4s}
.ptitle{font-size:17px;font-weight:600;color:#0f172a;margin-bottom:4px}
.psub{font-size:13px;color:#64748b;margin-bottom:22px;line-height:1.5}

/* Type selection */
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.typebtn{border:1.5px solid #e2e8f0;border-radius:12px;padding:24px 16px;cursor:pointer;background:#fff;text-align:center;transition:all .18s}
.typebtn:hover{border-color:#93c5fd;background:#f0f7ff;transform:translateY(-2px);box-shadow:0 4px 12px rgba(59,130,246,.1)}
.typebtn-icon{font-size:30px;margin-bottom:10px}
.typebtn-name{font-size:15px;font-weight:600;color:#0f172a;margin-bottom:4px}
.typebtn-desc{font-size:12px;color:#64748b;line-height:1.4}

/* Field labels with weight badge */
.flabel{font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;margin-top:20px;padding-bottom:6px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:6px}
.flabel:first-child{margin-top:0}
.wbadge{display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;padding:1px 7px;border-radius:20px;background:#1e3a5f;color:#93c5fd;letter-spacing:.5px;flex-shrink:0}
.wbadge.w-high{background:#1e3a5f;color:#93c5fd}
.wbadge.w-mid{background:#1c2e1c;color:#86efac}
.wbadge.w-low{background:#2d1f0e;color:#fcd34d}

/* Option cards */
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}
.optcard{border:1.5px solid #e2e8f0;border-radius:10px;padding:14px 12px;cursor:pointer;background:#fff;text-align:center;transition:all .18s;position:relative;overflow:hidden}
.optcard:hover{border-color:#93c5fd;background:#f0f7ff;transform:translateY(-1px)}
.optcard.sel::after{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.risk1.sel{border-color:#16a34a;background:#f0fdf4;box-shadow:0 0 0 3px rgba(22,163,74,.1)}
.risk1.sel::after{background:#16a34a}
.risk2.sel{border-color:#d97706;background:#fffbeb;box-shadow:0 0 0 3px rgba(217,119,6,.1)}
.risk2.sel::after{background:#d97706}
.risk3.sel{border-color:#dc2626;background:#fef2f2;box-shadow:0 0 0 3px rgba(220,38,38,.1)}
.risk3.sel::after{background:#dc2626}
.riskI{border-style:dashed}
.riskI:hover{border-color:#991b1b;background:#fff5f5;border-style:solid}
.riskI.sel{border-color:#991b1b;background:#1c0a0a;box-shadow:0 0 0 3px rgba(153,27,27,.3);border-style:solid}
.riskI.sel::after{background:#dc2626}
.riskI.sel .opt-badge{background:#dc2626;color:#fff}
.riskI.sel .opt-name{color:#fca5a5}
.riskI.sel .opt-desc{color:#6b7280}
.riskI .opt-name{color:#64748b}
.opt-badge{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-size:11px;font-weight:700;margin-bottom:8px;background:#f1f5f9;color:#64748b;transition:all .18s}
.risk1.sel .opt-badge{background:#16a34a;color:#fff}
.risk2.sel .opt-badge{background:#d97706;color:#fff}
.risk3.sel .opt-badge{background:#dc2626;color:#fff}
.opt-name{font-size:12px;font-weight:600;color:#1e293b;line-height:1.3;margin-bottom:4px}
.opt-desc{font-size:11px;color:#94a3b8;line-height:1.3}

.warn-banner{background:#fff1f2;border:1.5px solid #fca5a5;border-radius:10px;padding:12px 16px;margin-top:16px;display:flex;gap:10px;align-items:flex-start}
.warn-icon{font-size:16px;flex-shrink:0}
.warn-text{font-size:12px;color:#7f1d1d;line-height:1.6}
.warn-text strong{display:block;margin-bottom:2px}

.btn-row{display:flex;gap:10px;margin-top:24px}
.btn{padding:12px 24px;border-radius:10px;font-size:14px;cursor:pointer;border:1.5px solid #e2e8f0;background:#fff;color:#475569;font-weight:500;transition:all .15s}
.btn:hover{background:#f8fafc}
.btnp{flex:1;background:#0c1a2e;color:#fff;border-color:#0c1a2e;font-weight:600}
.btnp:hover{background:#1e293b}
.btnp.off{background:#e2e8f0;color:#94a3b8;border-color:#e2e8f0;cursor:not-allowed}

/* Result */
.result-hero{border-radius:12px;padding:32px 28px;text-align:center;margin-bottom:20px}
.result-tag{font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;opacity:.7}
.result-type{font-size:13px;font-weight:500;margin-bottom:10px;opacity:.7}
.result-level{font-size:46px;font-weight:700;letter-spacing:-1.5px;margin-bottom:8px;line-height:1}
.result-score{font-size:15px;font-weight:500;opacity:.8}
.barwrap{margin:20px 0 6px}
.bartrack{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-bottom:6px}
.arrowrow{position:relative;height:18px}
.arrowptr{position:absolute;transform:translateX(-50%);width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:12px solid;transition:left .6s}
.barlabels{display:flex;font-size:10px;opacity:.55;margin-top:4px}
.barlabel-item{line-height:1.4}

.rcards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.rcard{background:#fff;border-radius:10px;padding:14px 18px;border:1px solid #e2e8f0}
.rcard-label{font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.rcard-val{font-size:14px;font-weight:600;color:#1e293b}

.mbox{border:1px solid #e2e8f0;border-radius:12px;padding:18px 20px;margin-bottom:12px}
.mtitle{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:#64748b;margin-bottom:12px}
.mrow{display:flex;gap:10px;margin-bottom:8px;align-items:flex-start}
.mbullet{width:6px;height:6px;border-radius:50%;margin-top:5px;flex-shrink:0}
.mtext{font-size:13px;color:#475569;line-height:1.5}

.inac-list{background:#0f0a0a;border-radius:10px;padding:16px 18px;margin-bottom:14px;border:1.5px solid #3b1010}
.inac-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:#dc2626;margin-bottom:10px}
.inac-row{display:flex;gap:8px;margin-bottom:6px;align-items:flex-start}
.inac-dot{width:6px;height:6px;background:#dc2626;border-radius:50%;margin-top:5px;flex-shrink:0}
.inac-text{font-size:13px;color:#fca5a5;line-height:1.4}

/* Breakdown – weighted */
.bkbtn{width:100%;padding:10px;border:1.5px solid #e2e8f0;border-radius:10px;cursor:pointer;font-size:13px;color:#64748b;background:#fff;margin-bottom:8px;transition:background .15s;font-weight:500}
.bkbtn:hover{background:#f8fafc}
.bkwrap{background:#f8fafc;border-radius:10px;padding:16px;margin-bottom:8px}
.bkrow{display:grid;grid-template-columns:1fr 36px 68px 52px;align-items:center;gap:8px;margin-bottom:10px}
.bkrow:last-child{margin-bottom:0}
.bk-labelcol{}
.bk-factorlabel{font-size:12px;color:#334155;font-weight:500;line-height:1.2;margin-bottom:3px}
.bk-contrib-bar{height:5px;background:#e2e8f0;border-radius:3px;overflow:hidden;margin-top:3px}
.bk-contrib-fill{height:100%;border-radius:3px;transition:width .6s}
.bk-wpct{font-size:11px;font-weight:700;color:#64748b;text-align:center}
.bk-valbadge{font-size:10px;font-weight:700;padding:3px 6px;border-radius:8px;text-align:center}
.bk-pts{font-size:12px;font-weight:700;color:#1e293b;text-align:right}

/* Methodology */
.methbtn{width:100%;padding:10px;border:1.5px solid #dbeafe;border-radius:10px;cursor:pointer;font-size:13px;color:#1d4ed8;background:#eff6ff;margin-bottom:8px;transition:background .15s;font-weight:500}
.methbtn:hover{background:#dbeafe}
.methwrap{background:#f8fafc;border-radius:10px;padding:0;margin-bottom:12px;overflow:hidden;border:1px solid #e2e8f0}
.meth-header{display:grid;grid-template-columns:1fr 50px 1fr;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#94a3b8;padding:10px 16px;background:#f1f5f9;border-bottom:1px solid #e2e8f0}
.meth-row{display:grid;grid-template-columns:1fr 50px 1fr;padding:9px 16px;border-bottom:1px solid #f1f5f9;align-items:center}
.meth-row:last-child{border-bottom:none}
.meth-factor{font-size:12px;color:#334155;font-weight:500}
.meth-peso{font-size:12px;font-weight:700;color:#1d4ed8;text-align:center}
.meth-ref{font-size:11px;color:#64748b;line-height:1.4}
.meth-note{font-size:11px;color:#94a3b8;padding:10px 16px;background:#f8fafc;font-style:italic}

.resetbtn{width:100%;padding:12px;border:1.5px solid #e2e8f0;border-radius:10px;cursor:pointer;font-size:13px;color:#64748b;background:#fff;transition:background .15s;font-weight:500}
.resetbtn:hover{background:#f8fafc}

@media(max-width:480px){
  .type-grid,.grid4{grid-template-columns:1fr 1fr}
  .rcards{grid-template-columns:1fr}
  body{padding:16px 12px}
  .card{padding:20px 16px}
  .result-level{font-size:36px}
  .bkrow{grid-template-columns:1fr 32px 60px 44px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="header-left">
      <div class="header-circle"><div class="header-inner"></div></div>
      <div>
        <div class="header-tag">Circle Capital – SGOIC, S.A.</div>
        <div class="header-title">Avaliação de Risco PBCFT</div>
      </div>
    </div>
    <div class="step-counter" id="stepcounter">Início</div>
  </div>

  <div class="preview" id="preview">
    <div>
      <div class="preview-label">Score projetado</div>
      <div class="preview-score" id="prev-score">—</div>
    </div>
    <div class="preview-bar">
      <div class="preview-track"><div class="preview-fill" id="prev-fill" style="width:0%"></div></div>
    </div>
    <div class="preview-level" id="prev-level" style="background:#1e293b;color:#64748b">Pendente</div>
  </div>

  <div class="card">
    <div class="pbar"><div class="pfill" id="pfill" style="width:0%"></div></div>
    <div id="root"></div>
  </div>
</div>

<script>
/* ── Weights & references ────────────────────────────────────────────── */
var WEIGHTS={
  tipo_cliente:0.13,
  beneficiario:0.20,
  pep:0.20,
  geografia:0.18,
  servicos:0.08,
  canal:0.04,
  padrao:0.17
};

var METH=[
  {key:"beneficiario",  label:"Beneficiário Efetivo", peso:"20%", ref:"AMLR Art. 53–55; Lei 89/2017 (RCBE); ESAs JC 2021/70 §4.29"},
  {key:"pep",           label:"PEP / Cargo Político",  peso:"20%", ref:"AMLR Art. 48–50; Lei 83/2017 Art. 39; FATF Rec. 12"},
  {key:"geografia",     label:"Jurisdição Geográfica", peso:"18%", ref:"FATF High-Risk Jurisdictions; ESAs JC 2021/70 §3.1–3.8; Reg. CMVM 2/2020 Art. 11"},
  {key:"padrao",        label:"Padrão Transacional",   peso:"17%", ref:"AMLR Art. 74; Lei 83/2017 Art. 18, 52; ESAs JC 2021/70 §4.42"},
  {key:"tipo_cliente",  label:"Tipo de Cliente",       peso:"13%", ref:"AMLR Art. 20–22; Lei 83/2017 Art. 23–28"},
  {key:"servicos",      label:"Atividade / Serviços",  peso:"8%",  ref:"ESAs JC 2021/70 §4.48–4.51; FATF DNFBP Guidance"},
  {key:"canal",         label:"Canal de Negócio",      peso:"4%",  ref:"AMLR Art. 41; EBA/GL/2022/15 Remote CDD; Lei 83/2017 Art. 38"}
];

function wClass(k){
  var w=WEIGHTS[k]*100;
  return w>=18?"w-high":w>=8?"w-mid":"w-low";
}

/* ── Pages ───────────────────────────────────────────────────────────── */
var PAGES_PS=[
  {title:"Perfil do Investidor e Beneficiário Efetivo",sub:"Caracterize o investidor pessoa singular e confirme se atua por conta própria.",fields:[
    {key:"tipo_cliente",label:"Tipo de Cliente",opts:[
      {v:1,name:"Assalariado / Rendimento Regulado",desc:"Trabalhador por conta de outrem, reformado ou com rendimentos de fontes reguladas"},
      {v:2,name:"Trabalhador Independente",desc:"Profissional liberal, empresário em nome individual ou atividade própria"},
      {v:3,name:"Atividade de Alto Risco",desc:"Setor cash-intensive, criptoativos, jogos, armamento ou atividade não regulada"},
      {v:"I",name:"⚠ Inaceitável",desc:"Em lista de sanções, jurisdição proibida ou identidade anónima/não verificável"}
    ]},
    {key:"beneficiario",label:"Beneficiário Efetivo",opts:[
      {v:1,name:"Próprio – Residente UE/EEE",desc:"Atua por conta própria; residente UE/EEE com identidade confirmada"},
      {v:2,name:"Próprio – Fora UE/EEE",desc:"Atua por conta própria; residente fora da UE/EEE, mas com identidade transparente"},
      {v:3,name:"Por conta de terceiro",desc:"Atua por conta de terceiro identificado; estrutura de representação verificada"},
      {v:"I",name:"⚠ Inaceitável",desc:"Recusa confirmar se atua por conta própria ou de terceiro; ausência de informação essencial"}
    ]}
  ]},
  {title:"Exposição Política e Jurisdição Geográfica",sub:"Avalie a exposição a PEPs e o risco da jurisdição de residência do investidor.",fields:[
    {key:"pep",label:"PEP / Cargo Político ou Público",opts:[
      {v:1,name:"Sem Exposição PEP",desc:"Sem qualquer relação com cargos políticos ou públicos"},
      {v:2,name:"PEP Doméstico",desc:"Pessoa Politicamente Exposta de âmbito nacional (Portugal)"},
      {v:3,name:"PEP Estrangeiro / Alto Risco",desc:"PEP estrangeiro ou associado a país de alto risco"},
      {v:"I",name:"⚠ Inaceitável",desc:"PEP ou titular de cargo classificado como inaceitável pelas autoridades competentes"}
    ]},
    {key:"geografia",label:"Jurisdição Geográfica",opts:[
      {v:1,name:"UE/EEE ou Equivalente",desc:"Residência em UE/EEE ou jurisdição favorável pelo GAFI"},
      {v:2,name:"Fora UE/EEE – Baixo Risco",desc:"País fora da UE/EEE não incluído em listas de alto risco do GAFI"},
      {v:3,name:"Offshore / Lista Negra FATF",desc:"Jurisdição offshore, sancionada ou constante da lista negra do FATF"},
      {v:"I",name:"⚠ Inaceitável",desc:"Jurisdição expressamente proibida em matéria de PBCFT"}
    ]}
  ]},
  {title:"Atividade, Canal e Perfil Transacional",sub:"Avalie o setor de atividade, o canal de onboarding e o comportamento esperado das operações.",fields:[
    {key:"servicos",label:"Atividade / Fonte de Rendimentos",opts:[
      {v:1,name:"Rendimento Regulado / Baixo Risco",desc:"Salário, pensão, dividendos de entidades reguladas ou outras fontes de baixo risco"},
      {v:2,name:"Atividade Imobiliária ou Liberal",desc:"Rendimentos imobiliários, profissões liberais ou importação/exportação"},
      {v:3,name:"Fonte de Alto Risco",desc:"Jogos, criptoativos, metais preciosos ou outras atividades cash-intensive"},
      {v:"I",name:"⚠ Inaceitável",desc:"Atividades criminosas, terrorismo ou condenação em processo-crime"}
    ]},
    {key:"canal",label:"Canal de Onboarding",opts:[
      {v:1,name:"Presencial",desc:"Presença física do investidor verificada durante o processo de subscrição"},
      {v:2,name:"Remoto com Salvaguardas",desc:"Identificação à distância via vídeo-ID ou prestador qualificado (EBA/GL/2022/15)"},
      {v:3,name:"Remoto sem Salvaguardas",desc:"Não presencial sem mecanismos de verificação adequados ou via intermediários"},
      {v:"I",name:"⚠ Inaceitável",desc:"Recusa em utilizar qualquer mecanismo de verificação de identidade"}
    ]}
  ]},
  {title:"Padrão Transacional",sub:"Avalie a coerência das operações previstas com o perfil declarado pelo investidor.",fields:[
    {key:"padrao",label:"Padrão Transacional",opts:[
      {v:1,name:"Consistente – Valor Baixo",desc:"Operações compatíveis com o perfil, de valor baixo e com racional económico claro"},
      {v:2,name:"Consistente – Valor Elevado",desc:"Operações compatíveis com o perfil, de valor elevado e com racional económico claro"},
      {v:3,name:"Complexo / Sem Racional",desc:"Estruturação complexa, movimentos de valor elevado sem racional económico evidente"},
      {v:"I",name:"⚠ Inaceitável",desc:"Recusa em justificar fundos ou operações incompatíveis com o perfil declarado"}
    ]}
  ]}
];

var PAGES_PC=[
  {title:"Tipo de Entidade e Beneficiário Efetivo",sub:"Classifique a entidade investidora e identifique o beneficiário efetivo (BE).",fields:[
    {key:"tipo_cliente",label:"Tipo de Cliente",opts:[
      {v:1,name:"Entidade Regulada UE/EEE",desc:"Instituição financeira regulada ou autoridade pública na UE/EEE com estrutura transparente"},
      {v:2,name:"Sociedade Não Regulada",desc:"Sociedade comercial não regulada com estrutura de propriedade transparente e direta"},
      {v:3,name:"Estrutura Opaca / Offshore",desc:"Entidade offshore, SPV, trust, fundação ou estrutura complexa e opaca"},
      {v:"I",name:"⚠ Inaceitável",desc:"Em lista de sanções, jurisdição proibida, entidade anónima ou controlada por indivíduos anónimos"}
    ]},
    {key:"beneficiario",label:"Beneficiário Efetivo (BE)",opts:[
      {v:1,name:"Identificado – UE/EEE e RCBE",desc:"BE identificado, residente UE/EEE e devidamente registado no RCBE"},
      {v:2,name:"Identificado – Fora UE/EEE",desc:"BE identificado, não residente UE/EEE, mas com estrutura de controlo transparente"},
      {v:3,name:"Não Identificado / Divergências",desc:"BE não identificado, divergências no RCBE, acionistas fiduciários ou indícios de anonimato"},
      {v:"I",name:"⚠ Inaceitável",desc:"BE recusa documentação exigida ou ausência total de informação sobre negócio/fundos"}
    ]}
  ]},
  {title:"Exposição Política e Jurisdição Geográfica",sub:"Avalie a exposição a PEPs nos órgãos sociais e o risco da jurisdição da entidade.",fields:[
    {key:"pep",label:"PEP / Cargo Político ou Público",opts:[
      {v:1,name:"Sem Exposição PEP",desc:"Nenhum membro dos órgãos sociais ou BE com exposição a cargos políticos ou públicos"},
      {v:2,name:"PEP Doméstico",desc:"Membro ou BE é Pessoa Politicamente Exposta de âmbito nacional (Portugal)"},
      {v:3,name:"PEP Estrangeiro / Alto Risco",desc:"Membro ou BE é PEP estrangeiro ou associado a país de alto risco"},
      {v:"I",name:"⚠ Inaceitável",desc:"PEP ou titular de cargo classificado como inaceitável pelas autoridades competentes"}
    ]},
    {key:"geografia",label:"Jurisdição Geográfica",opts:[
      {v:1,name:"UE/EEE ou Equivalente",desc:"Sede em UE/EEE ou jurisdição favorável pelo GAFI em matéria de PBCFT"},
      {v:2,name:"Fora UE/EEE – Baixo Risco",desc:"Sede em país fora da UE/EEE não incluído em listas de alto risco do GAFI"},
      {v:3,name:"Offshore / Lista Negra FATF",desc:"Sede em jurisdição offshore, sancionada ou constante da lista negra do FATF"},
      {v:"I",name:"⚠ Inaceitável",desc:"Sede em jurisdição expressamente proibida em matéria de PBCFT"}
    ]}
  ]},
  {title:"Atividade Económica e Canal de Negócio",sub:"Avalie o setor de atividade da entidade e o canal de onboarding.",fields:[
    {key:"servicos",label:"Atividade / Serviços",opts:[
      {v:1,name:"Setor Regulado / Baixo Risco",desc:"Setores supervisionados, retalho e outras atividades empresariais de baixo risco"},
      {v:2,name:"Risco Intermédio",desc:"Imobiliário, construção civil, importação/exportação para países não críticos"},
      {v:3,name:"Setor de Alto Risco",desc:"Jogos e casinos, criptoativos, metais e pedras preciosas, armamento, ONGs em zonas de conflito"},
      {v:"I",name:"⚠ Inaceitável",desc:"Atividades associadas a ilícitos criminais, terrorismo ou condenação em processo-crime"}
    ]},
    {key:"canal",label:"Canal da Relação de Negócio",opts:[
      {v:1,name:"Presencial",desc:"Presença física do representante da entidade verificada durante o processo"},
      {v:2,name:"Remoto com Salvaguardas",desc:"Identificação à distância via vídeo-ID ou prestador qualificado (EBA/GL/2022/15)"},
      {v:3,name:"Remoto sem Salvaguardas",desc:"Não presencial sem mecanismos de verificação adequados ou via intermediários"},
      {v:"I",name:"⚠ Inaceitável",desc:"Recusa em utilizar qualquer mecanismo de verificação de identidade"}
    ]}
  ]},
  {title:"Padrão Transacional",sub:"Avalie a coerência das operações previstas com o perfil declarado pela entidade.",fields:[
    {key:"padrao",label:"Padrão Transacional",opts:[
      {v:1,name:"Consistente – Valor Baixo",desc:"Operações compatíveis com o perfil, de valor baixo e com racional económico claro"},
      {v:2,name:"Consistente – Valor Elevado",desc:"Operações compatíveis com o perfil, de valor elevado e com racional económico claro"},
      {v:3,name:"Complexo / Sem Racional",desc:"Estruturação complexa, movimentos de valor elevado sem racional económico evidente"},
      {v:"I",name:"⚠ Inaceitável",desc:"Recusa em justificar fundos ou operações claramente incompatíveis com o perfil declarado"}
    ]}
  ]}
];

var FACTOR_LABELS={tipo_cliente:"Tipo de Cliente",beneficiario:"Beneficiário Efetivo",pep:"PEP / Cargo Político",geografia:"Jurisdição Geográfica",servicos:"Atividade / Serviços",canal:"Canal de Negócio",padrao:"Padrão Transacional"};
var FACTOR_ORDER=["tipo_cliente","beneficiario","pep","geografia","servicos","canal","padrao"];

var MEASURES={
  BAIXO:["Medidas simplificadas de identificação e diligência (verificação documental mínima).","Diligência reduzida, proporcional ao risco comprovadamente baixo.","Atualização da documentação KYC a cada 3 anos ou após expiração.","Screening de medidas restritivas (Dow Jones Financial Crime Search) a cada 3 anos."],
  MEDIO:["Medidas simplificadas com verificação documental completa.","Monitorização periódica das operações e do perfil do investidor.","Atualização da documentação KYC a cada 3 anos ou após expiração.","Screening de medidas restritivas (Dow Jones Financial Crime Search) a cada 3 anos."],
  ELEVADO:["Medidas reforçadas de identificação e diligência.","Aprovação prévia pelo Conselho de Administração obrigatória.","Verificação da origem dos fundos e do património do investidor.","Monitorização contínua e detalhada de todas as operações.","Atualização da documentação KYC anual ou após expiração.","Screening anual de medidas restritivas (Dow Jones Financial Crime Search)."],
  INACEITAVEL:["Recusa imediata da relação de negócio ou transação, independentemente da pontuação global.","Notificação à CMVM e demais autoridades competentes, se aplicável.","Registo documentado da ocorrência, análise efetuada e fundamentação da decisão de recusa."]
};

var RC={
  BAIXO:{c:"#14532d",bg:"#f0fdf4",bd:"#16a34a",bullet:"#16a34a",spbg:"#dcfce7",sptxt:"#14532d",label:"Risco Baixo"},
  MEDIO:{c:"#78350f",bg:"#fffbeb",bd:"#d97706",bullet:"#d97706",spbg:"#fef3c7",sptxt:"#78350f",label:"Risco Médio"},
  ELEVADO:{c:"#7f1d1d",bg:"#fef2f2",bd:"#dc2626",bullet:"#dc2626",spbg:"#fee2e2",sptxt:"#7f1d1d",label:"Risco Elevado"},
  INACEITAVEL:{c:"#fca5a5",bg:"#0f0a0a",bd:"#991b1b",bullet:"#dc2626",spbg:"#3b1010",sptxt:"#dc2626",label:"⚠ Inaceitável"}
};

/* ── State ──────────────────────────────────────────────────────────── */
var state={clientType:null,page:-1,ans:{},result:null,showBk:false,showMeth:false};

/* ── Score logic ────────────────────────────────────────────────────── */
function getPages(){return state.clientType==="PS"?PAGES_PS:PAGES_PC;}
function totalPages(){return getPages().length;}

function hasInaceitavel(){
  return Object.keys(state.ans).some(function(k){return state.ans[k]==="I";});
}

function calcWeightedScore(){
  var s=0;
  FACTOR_ORDER.forEach(function(k){
    var v=state.ans[k];
    if(v!==undefined&&v!=="I") s+=WEIGHTS[k]*Number(v);
  });
  return Math.round(s*7*10)/10; /* range 7–21, 1 decimal */
}

function getLevelFromScore(s){return s<=9?"BAIXO":s<=15?"MEDIO":"ELEVADO";}

function calcResult(){
  if(hasInaceitavel()) return{level:"INACEITAVEL",score:calcWeightedScore()};
  var s=calcWeightedScore();
  return{level:getLevelFromScore(s),score:s};
}

function pageOk(){
  if(state.page<0) return false;
  var p=getPages()[state.page];
  return p.fields.every(function(f){return state.ans[f.key]!==undefined;});
}

/* ── Preview ────────────────────────────────────────────────────────── */
function updatePreview(){
  var el=document.getElementById("preview");
  var sc=document.getElementById("prev-score");
  var fi=document.getElementById("prev-fill");
  var lv=document.getElementById("prev-level");
  if(!el) return;
  var answered=Object.keys(state.ans).length;
  if(answered===0||state.page<0){el.style.display="none";return;}
  el.style.display="flex";
  if(hasInaceitavel()){
    sc.textContent="⚠";fi.style.width="100%";fi.style.background="#dc2626";
    lv.textContent="Inaceitável";lv.style.background="#3b1010";lv.style.color="#dc2626";
    return;
  }
  /* Weighted extrapolation: partial weighted avg / answered weight sum */
  var wSum=0,wScore=0;
  FACTOR_ORDER.forEach(function(k){
    var v=state.ans[k];
    if(v!==undefined&&v!=="I"){wSum+=WEIGHTS[k];wScore+=WEIGHTS[k]*Number(v);}
  });
  var projected=wSum>0?Math.round((wScore/wSum)*7*10)/10:7;
  projected=Math.max(7,Math.min(21,projected));
  var level=getLevelFromScore(projected);
  var cfg=RC[level];
  var pct=Math.min(Math.max(((projected-7)/14)*100,0),100);
  sc.textContent=projected.toFixed(1)+" pts";
  fi.style.width=pct+"%";fi.style.background=cfg.bd;
  lv.textContent=answered+"/7 fatores · "+cfg.label.replace("Risco ","");
  lv.style.background=cfg.spbg;lv.style.color=cfg.sptxt;
}

/* ── Build screens ──────────────────────────────────────────────────── */
function buildTypeSelect(){
  return '<div class="ptitle">Novo Investidor</div>'+
    '<div class="psub">Selecione o tipo de investidor para iniciar a avaliação de risco de onboarding.</div>'+
    '<div class="type-grid">'+
      '<div class="typebtn" id="btn-ps"><div class="typebtn-icon">&#128100;</div>'+
      '<div class="typebtn-name">Pessoa Singular</div>'+
      '<div class="typebtn-desc">Investidor individual, profissional liberal ou trabalhador independente</div></div>'+
      '<div class="typebtn" id="btn-pc"><div class="typebtn-icon">&#127970;</div>'+
      '<div class="typebtn-name">Pessoa Coletiva</div>'+
      '<div class="typebtn-desc">Empresa, holding, fundo, fundação ou outra entidade com personalidade jurídica</div></div>'+
    '</div>';
}

function buildForm(){
  var p=getPages()[state.page];
  var body="";
  for(var fi=0;fi<p.fields.length;fi++){
    var f=p.fields[fi];
    var wpct=Math.round(WEIGHTS[f.key]*100)+"%";
    body+='<div class="flabel">'+f.label+' <span class="wbadge '+wClass(f.key)+'">'+wpct+'</span></div><div class="grid4">';
    for(var oi=0;oi<f.opts.length;oi++){
      var o=f.opts[oi];
      var rc=o.v==="I"?" riskI":o.v===1?" risk1":o.v===2?" risk2":" risk3";
      var sel=state.ans[f.key]===o.v?" sel":"";
      var badge=o.v==="I"?"⚠":o.v;
      body+='<div class="optcard'+rc+sel+'" data-key="'+f.key+'" data-val="'+o.v+'">'+
        '<div class="opt-badge">'+badge+'</div>'+
        '<div class="opt-name">'+o.name+'</div>'+
        '<div class="opt-desc">'+o.desc+'</div></div>';
    }
    body+='</div>';
  }
  if(hasInaceitavel()){
    body+='<div class="warn-banner"><div class="warn-icon">⚠</div>'+
      '<div class="warn-text"><strong>Condição inaceitável selecionada.</strong>'+
      'Independentemente dos restantes fatores, a avaliação resultará em recusa imediata da relação de negócio, '+
      'nos termos da Política de PBCFT da Circle Capital.</div></div>';
  }
  var ok=pageOk();
  var isLast=state.page===totalPages()-1;
  return '<div class="ptitle">'+p.title+'</div><div class="psub">'+p.sub+'</div>'+body+
    '<div class="btn-row">'+
      '<button class="btn" id="btnback">&#8592; Voltar</button>'+
      '<button class="btn btnp'+(ok?'':' off')+'" id="btnnext">'+(isLast?'Calcular Risco &#8594;':'Continuar &#8594;')+'</button>'+
    '</div>';
}

function buildResult(){
  var r=state.result;
  var cfg=RC[r.level];
  var typeLabel=state.clientType==="PS"?"Pessoa Singular":"Pessoa Coletiva";
  var arrowPct=r.level==="INACEITAVEL"?99:Math.min(Math.max(((r.score-7+0.5)/15)*100,0.5),99);

  /* Inaceitável list */
  var inacFactors=[];
  FACTOR_ORDER.forEach(function(k){if(state.ans[k]==="I") inacFactors.push(FACTOR_LABELS[k]);});
  var inacHtml="";
  if(r.level==="INACEITAVEL"&&inacFactors.length>0){
    inacHtml='<div class="inac-list"><div class="inac-title">Fatores com classificação inaceitável</div>';
    inacFactors.forEach(function(f){inacHtml+='<div class="inac-row"><div class="inac-dot"></div><span class="inac-text">'+f+'</span></div>';});
    inacHtml+='</div>';
  }

  /* Measures */
  var mhtml="";
  MEASURES[r.level].forEach(function(m){
    mhtml+='<div class="mrow"><div class="mbullet" style="background:'+cfg.bullet+'"></div><span class="mtext">'+m+'</span></div>';
  });

  /* Score bar */
  var barHtml="";
  if(r.level!=="INACEITAVEL"){
    barHtml='<div class="barwrap">'+
      '<div class="bartrack">'+
        '<div style="width:20%;background:#16a34a"></div>'+
        '<div style="width:40%;background:#d97706"></div>'+
        '<div style="width:40%;background:#dc2626"></div>'+
      '</div>'+
      '<div class="arrowrow"><div class="arrowptr" style="left:'+arrowPct+'%;border-bottom-color:'+cfg.c+'"></div></div>'+
      '<div class="barlabels" style="color:'+cfg.c+'">'+
        '<div class="barlabel-item" style="width:20%">7–9<br>Baixo</div>'+
        '<div class="barlabel-item" style="width:40%;text-align:center">10–15<br>Médio</div>'+
        '<div class="barlabel-item" style="width:40%;text-align:right">16–21<br>Elevado</div>'+
      '</div></div>';
  }

  /* Weighted breakdown */
  var bkhtml="";
  if(state.showBk){
    FACTOR_ORDER.forEach(function(k){
      var v=state.ans[k];
      if(v===undefined) return;
      var w=WEIGHTS[k];
      var contrib=v==="I"?0:Math.round(w*Number(v)*7*10)/10;
      var maxContrib=Math.round(w*3*7*10)/10;
      var barW=v==="I"?100:Math.round((contrib/maxContrib)*100);
      var col=v==="I"?"#dc2626":v===3?"#dc2626":v===2?"#d97706":"#16a34a";
      var badge=v==="I"?"⚠ Inac.":v===1?"Baixo":v===2?"Médio":"Elevado";
      var bbg=v==="I"?"#3b1010":v===1?"#dcfce7":v===2?"#fef3c7":"#fee2e2";
      var bcol=v==="I"?"#dc2626":v===1?"#14532d":v===2?"#78350f":"#7f1d1d";
      bkhtml+='<div class="bkrow">'+
        '<div class="bk-labelcol">'+
          '<div class="bk-factorlabel">'+FACTOR_LABELS[k]+'</div>'+
          '<div class="bk-contrib-bar"><div class="bk-contrib-fill" style="width:'+barW+'%;background:'+col+'"></div></div>'+
        '</div>'+
        '<div class="bk-wpct">'+Math.round(w*100)+'%</div>'+
        '<div class="bk-valbadge" style="background:'+bbg+';color:'+bcol+'">'+badge+'</div>'+
        '<div class="bk-pts">'+(v==="I"?"—":contrib.toFixed(1))+'</div>'+
      '</div>';
    });
    bkhtml+='<div style="display:flex;justify-content:flex-end;padding-top:8px;border-top:1px solid #e2e8f0;margin-top:4px">'+
      '<span style="font-size:11px;color:#64748b;margin-right:8px">Score ponderado total</span>'+
      '<span style="font-size:13px;font-weight:700;color:#1e293b">'+(r.level==="INACEITAVEL"?"—":r.score.toFixed(1)+' / 21.0 pts')+'</span>'+
    '</div>';
  }

  /* Methodology table */
  var methHtml="";
  if(state.showMeth){
    methHtml='<div class="methwrap">'+
      '<div class="meth-header"><div>Fator</div><div style="text-align:center">Peso</div><div>Referência Regulatória</div></div>';
    METH.forEach(function(m){
      methHtml+='<div class="meth-row">'+
        '<div class="meth-factor">'+m.label+'</div>'+
        '<div class="meth-peso">'+m.peso+'</div>'+
        '<div class="meth-ref">'+m.ref+'</div>'+
      '</div>';
    });
    methHtml+='<div class="meth-note">Metodologia baseada nas ESAs Joint Guidelines JC 2021/70, AMLR (UE) 2024/1624, EBA/GL/2022/05 e EBA/GL/2022/15, adaptada à atividade de gestão de OIC (SGOIC) nos termos do Regulamento CMVM n.º 2/2020, alterado pelo Regulamento n.º 5/2025.</div>'+
    '</div>';
  }

  var updateFreq=r.level==="ELEVADO"?"Anual":r.level==="INACEITAVEL"?"N/A":"A cada 3 anos";
  var diligencia=r.level==="ELEVADO"?"Reforçada":r.level==="INACEITAVEL"?"Recusa":"Simplificada";

  return '<div class="result-hero" style="background:'+cfg.bg+';border:1.5px solid '+cfg.bd+'">'+
    '<div class="result-tag" style="color:'+cfg.c+'">Classificação de Risco PBCFT · Circle Capital</div>'+
    '<div class="result-type" style="color:'+cfg.c+'">'+typeLabel+'</div>'+
    '<div class="result-level" style="color:'+cfg.c+'">'+cfg.label+'</div>'+
    '<div class="result-score" style="color:'+cfg.c+'">'+(r.level==="INACEITAVEL"?"Condição de exclusão automática identificada":"Score ponderado: "+r.score.toFixed(1)+" / 21.0 pts")+'</div>'+
    barHtml+'</div>'+
  inacHtml+
  '<div class="rcards">'+
    '<div class="rcard"><div class="rcard-label">Score Ponderado</div><div class="rcard-val">'+(r.level==="INACEITAVEL"?"—":r.score.toFixed(1)+" / 21.0")+'</div></div>'+
    '<div class="rcard"><div class="rcard-label">Tipo de Investidor</div><div class="rcard-val">'+typeLabel+'</div></div>'+
    '<div class="rcard"><div class="rcard-label">Atualização KYC</div><div class="rcard-val">'+updateFreq+'</div></div>'+
    '<div class="rcard"><div class="rcard-label">Nível de Diligência</div><div class="rcard-val">'+diligencia+'</div></div>'+
  '</div>'+
  '<div class="mbox"><div class="mtitle">Medidas a Aplicar · Lei 83/2017 e Política PBCFT</div>'+mhtml+'</div>'+
  '<button class="bkbtn" id="btnbk">'+(state.showBk?"▲ Ocultar":"▼ Ver")+' decomposição por fator</button>'+
  (state.showBk?'<div class="bkwrap">'+bkhtml+'</div>':'')+
  '<button class="methbtn" id="btnmeth">'+(state.showMeth?"▲ Ocultar":"▼ Ver")+' metodologia de pesos</button>'+
  methHtml+
  '<button class="resetbtn" id="btnreset">&#8592; Nova Avaliação</button>';
}

/* ── Navigation & bind ──────────────────────────────────────────────── */
function goNext(){
  if(state.page<totalPages()-1){state.page++;draw();}
  else{state.result=calcResult();draw();}
}

function bind(){
  var btnnext=document.getElementById("btnnext");
  if(btnnext) btnnext.onclick=function(){if(pageOk()) goNext();};
  var btnback=document.getElementById("btnback");
  if(btnback) btnback.onclick=function(){
    if(state.page===0){state.page=-1;state.ans={};state.clientType=null;}
    else state.page--;
    draw();
  };
  var btnbk=document.getElementById("btnbk");
  if(btnbk) btnbk.onclick=function(){state.showBk=!state.showBk;draw();};
  var btnmeth=document.getElementById("btnmeth");
  if(btnmeth) btnmeth.onclick=function(){state.showMeth=!state.showMeth;draw();};
  var btnreset=document.getElementById("btnreset");
  if(btnreset) btnreset.onclick=function(){state={clientType:null,page:-1,ans:{},result:null,showBk:false,showMeth:false};draw();};
  var btnps=document.getElementById("btn-ps");
  if(btnps) btnps.onclick=function(){state.clientType="PS";state.page=0;state.ans={};draw();};
  var btnpc=document.getElementById("btn-pc");
  if(btnpc) btnpc.onclick=function(){state.clientType="PC";state.page=0;state.ans={};draw();};
  var opts=document.querySelectorAll(".optcard");
  for(var i=0;i<opts.length;i++){
    (function(el){
      el.onclick=function(){
        var raw=el.getAttribute("data-val");
        state.ans[el.getAttribute("data-key")]=raw==="I"?"I":parseInt(raw);
        draw();
      };
    })(opts[i]);
  }
}

function draw(){
  var root=document.getElementById("root");
  var pfill=document.getElementById("pfill");
  var counter=document.getElementById("stepcounter");
  var prev=document.getElementById("preview");
  if(state.result){
    if(pfill) pfill.style.width="100%";
    if(counter) counter.textContent="Resultado";
    root.innerHTML=buildResult();
    if(prev) prev.style.display="none";
  } else if(state.page<0){
    if(pfill) pfill.style.width="0%";
    if(counter) counter.textContent="Início";
    root.innerHTML=buildTypeSelect();
    if(prev) prev.style.display="none";
  } else {
    var pct=((state.page+1)/totalPages())*100;
    if(pfill) pfill.style.width=pct+"%";
    if(counter) counter.textContent="Passo "+(state.page+1)+" de "+totalPages();
    root.innerHTML=buildForm();
    updatePreview();
  }
  bind();
}

draw();
</script>
</body>
</html>
